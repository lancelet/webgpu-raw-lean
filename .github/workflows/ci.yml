# Builds and tests the generator and the bindings on Linux, macOS and Windows,
# and for the web as WebAssembly; publishes the web build to GitHub Pages.
#
# To build yourself, do what each step's comment says, in a POSIX shell (on
# Windows, Git Bash). No GPU is needed: the tests create an instance and call
# functions on it, which needs none; and test a device where there is an
# adapter, which every runner has (macOS's a virtual Metal device, Windows's
# WARP, Linux's Mesa's lavapipe, installed below), so here one is required.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # CI only: the tests fail, rather than skip a device's checks, if they
    # find no adapter.
    env:
      WEBGPU_RAW_REQUIRE_ADAPTER: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Not a build step: checks the shell scripts the build uses.
      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck vendor/*/fetch.sh scripts/*.sh

      # On Linux, a GPU in software, Mesa's lavapipe, through the Vulkan loader:
      # CI's Linux runners have none.
      - name: Install a software GPU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      # Fetch the prebuilt wgpu-native release for this platform, into
      # vendor/wgpu-native/<platform>/.
      - name: Fetch wgpu-native
        run: vendor/wgpu-native/fetch.sh

      # On Windows, the C shims are compiled with MinGW's gcc (Lean's own
      # compiler lacks the C library's headers; elsewhere the build uses cc),
      # and programs find wgpu_native.dll through PATH (elsewhere the build
      # records where the library is).
      - name: Set up the C compiler and wgpu-native (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          lib="$GITHUB_WORKSPACE\\vendor\\wgpu-native\\windows-x86_64\\lib"
          echo "$lib" >> "$GITHUB_PATH"

      # Lean's standard CI action. It installs elan (which installs the Lean
      # toolchain named in `lean-toolchain`), then runs, in webgpu-gen/:
      #
      #     lake build
      #     lake test
      #
      # The generator is only needed to regenerate the bindings: users of the
      # bindings can skip this step and the next.
      #
      # The generated shims are compiled with the system C compiler, and on
      # Linux with clang too, which warns of what gcc allows (clang is macOS's
      # compiler already). By path, since Lake puts Lean's own clang first.
      - name: Build and test the generator
        uses: leanprover/lean-action@v1
        env:
          CLANG: ${{ runner.os == 'Linux' && '/usr/bin/clang' || '' }}
        with:
          lake-package-directory: webgpu-gen
          auto-config: false
          build: true
          test: true

      # The generated files must come from a committed generator (their
      # banners say "(clean)", not "(dirty)"), and be what the generator makes
      # now: only the banner's commit and time may differ.
      - name: Check the generated files are up to date
        if: runner.os == 'Linux'
        run: |
          if grep -rn 'Generator commit: .* (dirty)' WebGPU c/generated; then
            echo "Generated from uncommitted changes: commit the generator," \
              "then regenerate and commit the generated files." >&2
            exit 1
          fi
          (cd webgpu-gen && lake exe webgpu-gen generate)
          git diff --exit-code -I '^  Generator commit:' -I '^  Generated:' \
            -- WebGPU c/generated
          # And the list of wgpu-native's stubs, which the generator reads, is
          # what its source at the pinned version gives.
          vendor/wgpu-native/stubs.sh
          git diff --exit-code -- vendor/wgpu-native/stubs

      # Runs, at the repository root:
      #
      #     lake build
      #     lake test
      - name: Build and test the bindings
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true

      # Not a build step: checks that the build rebuilds the C shims when a
      # header they include changes.
      - name: Check header edits rebuild the shims
        if: runner.os == 'Linux'
        run: scripts/check-shim-rebuild.sh

      # Not a build step: checks that every shim's C types agree with how Lean
      # calls it, against Lean's own declarations.
      - name: Check the shims agree with Lean's ABI
        if: runner.os == 'Linux'
        run: scripts/check-abi.sh

      # The tests again, in the build where each poke (the unchecked writes the
      # encoders make) also checks its array is unshared and its store fits,
      # stopping the program if not; -R, so that Lake applies the option.
      - name: Test with the pokes checked
        run: lake test -R -K checkPokes=true

      # And back to the normal build: Lake keeps -K options in its configuration
      # until the next -R, and the CI cache keeps that configuration.
      - name: Reconfigure for the normal build
        run: lake build -R

      # Not a build step: the benchmark, briefly, so that it keeps building and
      # running. Its figures here mean little (a shared machine); run it
      # yourself with `lake exe webgpu-raw-bench`.
      - name: Run the benchmark briefly
        run: lake exe webgpu-raw-bench 10000

      # The window library (WebGPUWindow), on SDL3, which only programs that
      # use it need. On Linux, SDL is built from source, and needs the window
      # systems' headers; its test draws in a window under a virtual display.
      - name: Install SDL3's build dependencies, and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libdrm-dev libgbm-dev \
            xvfb

      # Fetch SDL3 into vendor/sdl3/<platform>/: built from source on Linux
      # and macOS (with cmake), MinGW's prebuilt release on Windows, whose
      # SDL3.dll programs find through PATH.
      - name: Fetch SDL3
        run: |
          vendor/sdl3/fetch.sh
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$GITHUB_WORKSPACE\\vendor\\sdl3\\windows-x86_64\\bin" \
              >> "$GITHUB_PATH"
          fi

      # Build the window library and its test, and run it, a window
      # required: on Linux under a virtual display; on Windows on the
      # runner's desktop; on macOS, whose runner has no display, a headless
      # window (a Metal layer of its own).
      - name: Build and test the window library
        env:
          WEBGPU_RAW_REQUIRE_WINDOW: 1
        run: |
          lake build WebGPUWindow webgpu-window-test
          if [ "$RUNNER_OS" = Linux ]; then
            SDL_VIDEO_DRIVER=x11 \
              xvfb-run -a .lake/build/bin/webgpu-window-test
          else
            .lake/build/bin/webgpu-window-test
          fi

      # The examples: the triangle, three frames of it, where there is a
      # display (not on macOS's runner).
      - name: Build and run the examples
        run: |
          lake build triangle
          if [ "$RUNNER_OS" = Linux ]; then
            SDL_VIDEO_DRIVER=x11 xvfb-run -a .lake/build/bin/triangle 3
          elif [ "$RUNNER_OS" = Windows ]; then
            .lake/build/bin/triangle 3
          fi

  # The web build: Lean, the bindings and the self-test as WebAssembly. To
  # build it yourself: install the Emscripten SDK at the version in
  # web/emscripten-version (and cmake and make), then run web/build.sh. The
  # self-test runs under Node and in a browser, and the page is published to
  # GitHub Pages.
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the Emscripten version
        id: emscripten
        run: echo "version=$(cat web/emscripten-version)" >> "$GITHUB_OUTPUT"

      # The Emscripten SDK, at that version: emcc, em++, emar and emcmake.
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emscripten.outputs.version }}
          actions-cache-folder: emsdk-cache

      # Node, to run the self-test; any recent version will do.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Lean's standard CI action, here only to install elan (and through it
      # the toolchain lean-toolchain names): web/build.sh runs Lake itself.
      # Its Lake cache is the native build's, so this job leaves it alone.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      # CI only: what web/build.sh builds once per Lean version and setup
      # (Lean's runtime, Init and libuv for WebAssembly), Emscripten's own
      # cache, and the sources fetched for them, kept between runs.
      - uses: actions/cache@v5
        with:
          path: |
            .lake/web/v*
            .lake/web/emscripten-cache
            vendor/lean4/v*
            vendor/libuv/v*
          key: >-
            web-${{ hashFiles('lean-toolchain', 'web/build.sh',
            'web/emscripten-version', 'web/include/**',
            'vendor/lean4/fetch.sh', 'vendor/libuv/fetch.sh') }}

      # First in the build where each poke also checks its array is unshared
      # and its store fits, as natively: the tests only, not to publish.
      - name: Build for the web, with the pokes checked
        run: WEBGPU_RAW_CHECK_POKES=1 web/build.sh

      - name: Run the self-test under Node, with the pokes checked
        run: node .lake/web/site/webgpu-raw-web-test.js

      - name: Build for the web
        run: web/build.sh

      # Not a build step: the list of functions emdawnwebgpu's header does
      # not declare, which the generator reads, is what that header gives.
      - name: Check the list of functions Dawn lacks
        run: |
          vendor/emdawnwebgpu/missing.sh
          git diff --exit-code -- vendor/emdawnwebgpu/missing

      - name: Run the self-test under Node
        run: node .lake/web/site/webgpu-raw-web-test.js

      # The page around it, in headless Chrome (installed on GitHub's runners),
      # whose software adapter (SwiftShader) the device checks require here.
      - name: Check the page in a browser
        env:
          WEBGPU_RAW_REQUIRE_ADAPTER: 1
        run: web/check-page.sh

      # CI only: the built site, for the pages job to publish.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .lake/web/site

  # Publishes the web build to GitHub Pages, from main only.
  pages:
    name: pages
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, web]
    runs-on: ubuntu-latest
    # One deployment at a time; a newer one waits rather than cancels.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
